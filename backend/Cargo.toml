[package]
name = "tesou"
version = "1.0.1"
authors = ["Nicolas Pernoud <github@ninico.fr>"]
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros", "json", "query"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
http = "1.5.0"
http-body-util = "0.1.5"
base64ct = { version = "1.8.3", features = ["alloc"] }
chacha20poly1305 = "0.11.0"
diesel = { version = "2.3.13", features = ["r2d2", "sqlite"] }
diesel_migrations = "2.3.2"
env_logger = "0.11.11"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
log = "0.4.34"
r2d2 = "0.8.10"
rand = "0.10.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
urlencoding = "2.1.3"

[target.'cfg(unix)'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }

[dev-dependencies]
futures = "0.3.34"
tokio-tungstenite = "0.30.0"
regex = "1.13.1"
